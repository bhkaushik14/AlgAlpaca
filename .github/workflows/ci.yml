name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python and evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev,evaluation,web,demo]"
      - name: Ruff
        run: python -m ruff check .
      - name: Validate frozen fixture
        run: python evaluation/validate_confirmatory.py
      - name: Validate evaluation results
        run: python evaluation/validate_results.py
      - name: Python tests and policy conformance
        run: python -m pytest -q -s

  # The launcher check requires a configured private local adapter directory and remains local.

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
